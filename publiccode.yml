description:
  en:
    localisedName: Plausi Package
    shortDescription: Predict votes and detect anomalies using R.
    longDescription: Plausi is a statistical toolkit that helps ensure the integrity
      of vote and election results by automatically flagging patterns that
      warrant a closer look. Using robust statistical methods and machine
      learning, it detects irregularities such as unusual voter turnout patterns
      or results that deviate unexpectedly from what similar municipalities
      would be expected to show. It systematically compares results across all
      voting districts, making it possible to catch anomalies that would be
      difficult to spot by manually reviewing individual results one by one.
      Plausi forms the statistical foundation of the PlausiApp, which is already
      used for vote result quality control in the Cantons of Zurich, St. Gallen,
      and Thurgau. In short, it's a proven, science-based safeguard that
      supports confidence in the electoral process by helping authorities catch
      potential errors before results are finalized.
    documentation: https://github.com/machinelearningZH/plausi/blob/main/README.md
    features:
      - LLM
      - Dataset Description Generation
      - Metadata Generation
      - Structured Guidance
      - DCAT-AP ch Alignment
